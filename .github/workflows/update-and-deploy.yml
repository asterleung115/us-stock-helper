# 每個美股交易日收市後：更新股價同財務數據 → commit 返入 repo → build 網站 → 發佈去 GitHub Pages
# 亦可以喺 GitHub「Actions」頁撳「Run workflow」手動行；改 code push 去 main 都會重新發佈。
name: 更新數據並發佈

on:
  schedule:
    - cron: "30 22 * * 1-5" # UTC 22:30 = 美東收市後（夏令 18:30／冬令 17:30）
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update-data:
    # push 只係改 code，唔使重新攞數據
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/update_data.py
      - name: Commit 新數據
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then echo "數據冇變"; exit 0; fi
          git commit -m "自動更新數據 $(date -u +%F)"
          git push

  deploy:
    needs: update-data
    # update-data 被跳過（push）或者成功先發佈；數據更新失敗就保留舊網站
    if: always() && (needs.update-data.result == 'success' || needs.update-data.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # 攞埋啱啱 commit 嘅新數據
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
