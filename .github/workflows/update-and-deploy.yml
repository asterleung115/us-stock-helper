# 每個美股交易日收市後：攞最新數據 → build 網站 → 發佈去 GitHub Pages
# 數據唔會 commit 返入 repo（免得 repo 越嚟越大），每次發佈都會重新攞。
# 亦可以喺 GitHub「Actions」頁撳「Run workflow」手動行；push 去 main 都會重新發佈。
name: 更新數據並發佈

on:
  schedule:
    - cron: "30 22 * * 1-5" # UTC 22:30 = 美東收市後（夏令 18:30／冬令 17:30）
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt

      # 潛力觀察：篩選標普 500。失敗都繼續，只係嗰頁會用 repo 入面嘅舊數據
      - name: 篩選標普 500
        run: python scripts/update_screener.py
        continue-on-error: true

      # 個股數據（清單 + 潛力觀察名單入面嘅股票）。失敗就唔發佈，保留舊網站
      - name: 更新股價同財務數據
        run: python scripts/update_data.py

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
