# 每個美股交易日收市後：攞最新數據 → build 網站 → 發佈去 GitHub Pages
# 數據唔會 commit 返入 repo（免得 repo 越嚟越大），每次發佈都會重新攞。
# 亦可以喺 GitHub「Actions」頁撳「Run workflow」手動行；push 去 main 都會重新發佈。
name: 更新數據並發佈

on:
  schedule:
    # GitHub 嘅定時任務有時會延遲甚至跳過（尤其整點），所以揀非整點，再加一個後備時間
    - cron: "47 22 * * 1-5" # UTC 22:47 = 美東收市後（夏令 18:47／冬令 17:47）
    - cron: "17 2 * * 2-6" # 後備：UTC 02:17（香港 10:17）再更新一次
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write # 只用嚟將潛力股歷史記錄存入 history 分支
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt

      # 潛力股歷史記錄存喺獨立嘅 history 分支（唔會令 main 越嚟越大）
      - name: 讀取潛力股歷史記錄
        id: loadhist
        continue-on-error: true
        run: |
          if git ls-remote --exit-code --heads origin history; then
            git fetch --depth=1 origin history
            git show FETCH_HEAD:picks-history.json > public/data/picks-history.json
          else
            echo "未有 history 分支，由今日開始記錄"
          fi

      # 潛力觀察：篩選標普 500。失敗都繼續，只係嗰頁會冇最新數據
      - name: 篩選標普 500
        id: screener
        run: python scripts/update_screener.py
        continue-on-error: true

      # 讀取舊記錄失敗嘅話唔好儲存，免得覆蓋咗舊記錄
      - name: 儲存潛力股歷史記錄
        if: steps.loadhist.outcome == 'success' && steps.screener.outcome == 'success'
        continue-on-error: true
        env:
          TOKEN: ${{ github.token }}
        run: |
          tmp=$(mktemp -d)
          cp public/data/picks-history.json "$tmp/"
          cd "$tmp"
          git init -q -b history
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add picks-history.json
          git commit -q -m "潛力股歷史記錄 $(date -u +%F)"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" history

      # 個股數據（清單 + 潛力觀察名單入面嘅股票）。失敗就唔發佈，保留舊網站
      - name: 更新股價同財務數據
        run: python scripts/update_data.py

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
